<html lang="pt-BR"><head><meta charset="utf-8">

<title>Cleunides Souza Imobiliária</title>

<meta property="og:description" content="Encontre os melhores imóveis aqui." />

<style>
:root{color-scheme:light;--bg:#FDFBF7;--sf:#fff;--tx:#0F1E36;--mut:#5A6578;--ln:#E8E2D4;--pet:#0F1E36;--mid:#0B132B;--au:#C5A059;--au2:#D4AF37;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 Manrope,system-ui,sans-serif}
.hero{position:relative;background:var(--mid) center/cover;color:#fff;padding:28px 24px 120px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(11,19,43,.96) 15%,rgba(15,30,54,.7) 60%,rgba(15,30,54,.45))}
.wrap{max-width:1160px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none}
.logo svg{width:60px;height:60px;flex:none}
.logo b{display:block;font:600 28px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em}
.logo small{display:block;margin-top:6px;font-size:12px;letter-spacing:.42em;color:var(--au);padding-left:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font:600 14px Manrope,sans-serif;cursor:pointer;text-decoration:none;transition:background .2s,color .2s}
.btn.gold{background:var(--au);color:var(--mid)}.btn.gold:hover{background:var(--au2)}
.btn.line{border:1px solid var(--au);color:#fff;background:transparent}.btn.line:hover{background:rgba(197,160,89,.18)}
.intro{padding:72px 0 0;max-width:640px;animation:in .8s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font:600 clamp(38px,6vw,64px)/1.04 "Cormorant Garamond",Georgia,serif;margin:0 0 16px}
.intro p{margin:0;font-size:18px;color:#D3DAE6;max-width:50ch}
.filters{max-width:1160px;margin:-72px auto 0;padding:0 24px;position:relative}
.fbox{background:var(--pet);border:1px solid rgba(197,160,89,.45);border-radius:18px;padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;box-shadow:0 18px 40px -18px rgba(11,19,43,.6)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#B8C3D6}
select,input{font:500 15px Manrope,sans-serif;color:#fff;background:#16294A;border:1px solid #2A3F66;border-radius:10px;padding:11px 12px;width:100%}
input::placeholder{color:#8794AB}
select:focus-visible,input:focus-visible,.btn:focus-visible,a:focus-visible,.clear:focus-visible{outline:2px solid var(--au);outline-offset:2px}
.acts{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.clear{background:none;border:0;color:#B8C3D6;font:600 14px Manrope;cursor:pointer;padding:10px}
main{max-width:1160px;margin:0 auto;padding:48px 24px 96px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h2{font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;margin:0;color:var(--pet)}
#count{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:26px}
.card{background:var(--pet);color:#fff;border:1px solid rgba(197,160,89,.4);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 30px -20px rgba(11,19,43,.7)}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--mid)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.04)}
.badge{position:absolute;left:12px;top:12px;background:var(--mid);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--au)}
.badge i{font-style:normal;color:var(--au);margin-left:6px}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.loc{font-size:13px;color:#A9B5C9}
.price{font:700 30px/1 "Cormorant Garamond",Georgia,serif;color:var(--au2)}
h3{font:700 22px/1.2 "Cormorant Garamond",Georgia,serif;margin:2px 0 0;color:#fff}
.sum{margin:0;font-size:14.5px;color:#C3CCDB}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 0;margin-top:4px;border-top:1px solid rgba(197,160,89,.3);border-bottom:1px solid rgba(197,160,89,.3);font-size:14px}
.stats span{display:inline-flex;align-items:center;gap:6px}
.stats svg{width:18px;height:18px;fill:none;stroke:var(--au);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stats small{color:#A9B5C9}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags em{font-style:normal;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid rgba(197,160,89,.5);color:#E6CE95}
.more{display:none;margin:0;padding-left:18px;font-size:14px;color:#C3CCDB}
.card.open .more{display:block}
.row{display:flex;gap:10px;margin-top:auto;padding-top:12px}
.row .btn{flex:1;padding:11px 12px}
.row .ghost{background:transparent;border:1px solid var(--au);color:#fff}.row .ghost:hover{background:rgba(197,160,89,.18)}
.empty{padding:56px 20px;text-align:center;color:var(--mut);border:1px dashed var(--ln);border-radius:var(--r)}
footer{background:var(--mid);color:#B8C3D6;padding:36px 24px;font-size:14px;border-top:2px solid var(--au)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer .logo svg{width:44px;height:44px}footer .logo b{font-size:22px}footer .logo small{font-size:10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgba(0,0,0,.45);z-index:10;transition:transform .2s}
.fab:hover{transform:scale(1.07)}.fab svg{width:32px;height:32px;fill:#fff}
@media(max-width:860px){.fbox{grid-template-columns:repeat(2,1fr)}.hero{padding-bottom:110px}.intro{padding-top:48px}}
@media(max-width:480px){.hero,.filters,main,footer{padding-left:16px;padding-right:16px}.fbox{grid-template-columns:1fr;padding:18px}.acts .btn{flex:1}.logo svg{width:48px;height:48px}.logo b{font-size:23px}.logo small{font-size:10px;letter-spacing:.3em}.intro p{font-size:16px}h2{font-size:28px}.price{font-size:27px}.row{flex-wrap:wrap}.row .btn{min-width:130px}.top .btn{padding:9px 14px}footer .wrap{flex-direction:column;align-items:flex-start}}
@media(min-width:1400px){.wrap,.filters,main{max-width:1320px}.grid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const $=id=>document.getElementById(id),brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}),link=m=>"https://wa.me/"+WA+"?text="+encodeURIComponent(m);
$("hero").style.backgroundImage="url("+P[1].img+")";
$("waTop").href=$("fab").href=link("Olá! Vim pelo site da Cleunides Souza Imobiliária e gostaria de atendimento.");
function fill(id,all,key){const u=[...new Set(P.map(p=>p[key]).filter(Boolean))].sort();$(id).innerHTML='<option value="">'+all+'</option>'+u.map(x=>"<option>"+x+"</option>").join("")}
fill("fCity","Todas as cidades","city");fill("fBai","Todas as regiões","bai");
function I(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+({bed:'<path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7M3 15h18M7 9V7h4v2"/>',bath:'<path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM6 12V6a2 2 0 0 1 4 0"/>',area:'<path d="M4 4h16v16H4zM4 10h6V4"/>',car:'<path d="M5 16v-4l2-5h10l2 5v4M3 16h18M7 19v-3M17 19v-3"/>'})[k]+"</svg>"}
function st(p){const s=[];s.push('<span>'+I('bed')+'<b>'+p.q+'</b><small>'+(p.q>1?"quartos":"quarto")+'</small></span>');if(p.b)s.push('<span>'+I('bath')+'<b>'+p.b+'</b><small>banheiros</small></span>');if(p.a)s.push('<span>'+I('area')+'<b>'+p.a+' m²</b><small>construídos</small></span>');if(p.v)s.push('<span>'+I('car')+'<b>'+p.v+'</b><small>'+(p.v>1?"vagas":"vaga")+'</small></span>');return s.join("")}
function render(){
const f={neg:$("fNeg").value,cat:$("fCat").value,city:$("fCity").value,bai:$("fBai").value,min:+$("fMin").value||0,max:+$("fMax").value||Infinity,ord:$("fOrd").value};
let l=P.filter(p=>(!f.neg||p.neg===f.neg)&&(!f.cat||p.cat===f.cat)&&(!f.city||p.city===f.city)&&(!f.bai||p.bai===f.bai)&&p.price>=f.min&&p.price<=f.max);
if(f.ord)l.sort((a,b)=>f.ord==="asc"?a.price-b.price:b.price-a.price);else l.sort((a,b)=>b.n-a.n);
$("count").textContent=l.length+(l.length===1?" imóvel encontrado":" imóveis encontrados");
$("grid").innerHTML=l.length?l.map(p=>'<article class="card"><div class="ph"><img src="'+p.img+'" alt="'+p.t+'" style="object-position:'+p.pos+'" loading="lazy"><span class="badge">'+p.neg+'<i>'+p.cat+'</i></span></div><div class="body"><div class="loc">'+p.city+(p.bai?" • "+p.bai:"")+'</div><div class="price">'+brl(p.price)+'</div><h3>'+p.t+'</h3><p class="sum">'+p.s+'</p><div class="stats">'+st(p)+'</div><div class="tags">'+p.tags.map(t=>"<em>"+t+"</em>").join("")+'</div><ul class="more">'+p.d.map(d=>"<li>"+d+"</li>").join("")+'</ul><div class="row"><button class="btn gold" data-t>Ver detalhes</button><a class="btn ghost" target="_blank" rel="noopener" href="'+link("Olá! Tenho interesse no imóvel: "+p.t+" ("+brl(p.price)+").")+'">Tenho interesse</a></div></div></article>').join(""):'<div class="empty">Nenhum imóvel encontrado com esses filtros. Toque em "Limpar filtros" para ver todos.</div>'}
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;const c=b.closest(".card");c.classList.toggle("open");b.textContent=c.classList.contains("open")?"Ocultar detalhes":"Ver detalhes"});
$("go").onclick=render;
$("clr").onclick=()=>{["fNeg","fCat","fCity","fBai","fMin","fMax","fOrd"].forEach(i=>$(i).value="");render()};
render();
</script></body></html>
